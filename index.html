<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小三年級 英語能力小勇士檢測站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeed',
                            100: '#fef3c7',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        kidBlue: '#0284c7',
                        kidPurple: '#8b5cf6',
                        kidGreen: '#10b981',
                        kidPink: '#ec4899',
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Fredoka', 'sans-serif'],
                        fredoka: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .bounce-hover {
            transition: all 0.2s ease-in-out;
        }
        .bounce-hover:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .btn-press:active {
            transform: translateY(2px);
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Navigation Bar -->
    <header class="bg-white/90 backdrop-blur border-b-4 border-sky-300 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-amber-300 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-sky-700 tracking-wide"> Grade 3 English Test</h1>
                    <p class="text-xs text-sky-500 font-bold">國小三年級 英語程度檢測站</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- SCREEN 1: Welcome & Student Profile -->
        <div id="welcomeScreen" class="bg-white rounded-3xl p-6 md:p-10 shadow-xl border-4 border-sky-200 text-center max-w-2xl mx-auto w-full transition-all duration-300">
            <div class="w-24 h-24 mx-auto mb-4 bg-sky-100 rounded-full flex items-center justify-center text-4xl text-sky-600 animate-pulse-subtle border-4 border-sky-300">
                <i class="fa-solid fa-star"></i>
            </div>
            
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-2">歡迎參加英語能力小勇士挑戰！</h2>
            <p class="text-slate-600 text-sm md:text-base mb-6">檢測包含聽力、字母、單字與簡單生活會話（共 10 題），請輸入個人資料準備開始！</p>

            <form id="studentForm" onsubmit="startQuiz(event)" class="space-y-4 max-w-md mx-auto text-left">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1"><i class="fa-solid fa-school text-sky-500 mr-1"></i> 班級 (Class)</label>
                    <input type="text" id="studentClass" required placeholder="例如：三年一班 或 301" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-lg">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1"><i class="fa-solid fa-hashtag text-sky-500 mr-1"></i> 座號 (No.)</label>
                        <input type="number" id="seatNumber" min="1" max="60" required placeholder="15" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1"><i class="fa-solid fa-user text-sky-500 mr-1"></i> 姓名 (Name)</label>
                        <input type="text" id="studentName" required placeholder="王小明" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-lg">
                    </div>
                </div>

                <!-- Sound Test Button -->
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 flex items-center justify-between">
                    <div class="text-xs text-amber-800 font-bold">
                        <i class="fa-solid fa-volume-high text-amber-500 mr-1"></i> 聲音測試：請確認喇叭或耳機音量
                    </div>
                    <button type="button" onclick="speakText('Welcome to the English test!')" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-lg text-xs transition">
                        點我試聽 <i class="fa-solid fa-play ml-1"></i>
                    </button>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-black py-4 rounded-2xl text-xl shadow-lg shadow-sky-200 bounce-hover btn-press transition mt-6">
                    🚀 開始測驗 Let's Go!
                </button>
            </form>
        </div>

        <!-- SCREEN 2: Quiz Container -->
        <div id="quizScreen" class="hidden bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-sky-200 max-w-3xl mx-auto w-full">
            
            <!-- Quiz Header Info -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-6 border-b border-slate-200">
                <div class="flex items-center gap-2">
                    <span id="questionBadge" class="bg-sky-100 text-sky-800 font-black px-3 py-1 rounded-full text-sm">
                        Question 1 / 10
                    </span>
                    <span id="categoryBadge" class="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full text-xs">
                        單字理解
                    </span>
                </div>
                <div class="text-xs text-slate-500 font-bold">
                    考生：<span id="displayStudentInfo" class="text-sky-700"></span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden mb-6">
                <div id="progressBar" class="bg-gradient-to-r from-sky-400 to-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>

            <!-- Question Box -->
            <div class="min-h-[160px] flex flex-col justify-center items-center text-center mb-6 p-4 bg-sky-50/50 rounded-2xl border border-sky-100 relative">
                <!-- Audio Button (Shows if question has sound) -->
                <button id="audioBtn" onclick="playCurrentQuestionAudio()" class="hidden mb-3 bg-amber-400 hover:bg-amber-500 text-slate-900 font-black px-5 py-2.5 rounded-full text-base shadow-md transition flex items-center gap-2 animate-bounce">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                    <span>按此聽英文語音</span>
                </button>
                
                <h3 id="questionText" class="text-xl md:text-2xl font-black text-slate-800 leading-relaxed">
                    <!-- Dynamic Question Text -->
                </h3>
                <p id="questionHint" class="text-xs text-slate-500 font-bold mt-2">
                    <!-- Dynamic Hint -->
                </p>
            </div>

            <!-- Options Grid -->
            <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Dynamic Options will be rendered here -->
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                <button id="prevBtn" onclick="prevQuestion()" disabled class="px-5 py-2.5 rounded-xl border-2 border-slate-200 text-slate-400 font-bold text-sm hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-arrow-left mr-1"></i> 上一題
                </button>
                <button id="nextBtn" onclick="nextQuestion()" disabled class="px-6 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-black text-sm shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- SCREEN 3: Result & Scoreboard -->
        <div id="resultScreen" class="hidden bg-white rounded-3xl p-6 md:p-10 shadow-xl border-4 border-amber-300 max-w-3xl mx-auto w-full text-center">
            
            <!-- Completion Graphic -->
            <div class="inline-block p-4 bg-amber-100 rounded-full text-amber-500 text-5xl mb-3">
                <i class="fa-solid fa-trophy"></i>
            </div>
            
            <h2 class="text-2xl md:text-3xl font-black text-slate-800">測驗完成！Awesome Job!</h2>
            <p id="resultStudentTitle" class="text-slate-600 text-sm md:text-base mt-1 font-bold"></p>

            <!-- Score Display -->
            <div class="my-6 p-6 bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl border-2 border-amber-200 flex flex-col md:flex-row items-center justify-around gap-4">
                <div>
                    <span class="text-xs font-bold text-amber-700 uppercase tracking-wider block">總分 Score</span>
                    <span id="finalScore" class="text-5xl md:text-6xl font-black text-amber-600">0</span>
                    <span class="text-lg font-bold text-slate-500"> / 100 分</span>
                </div>
                <div class="h-12 w-0.5 bg-amber-200 hidden md:block"></div>
                <div>
                    <span class="text-xs font-bold text-amber-700 uppercase tracking-wider block">答對題數 Correct</span>
                    <span id="correctCount" class="text-3xl md:text-4xl font-black text-emerald-600">0</span>
                    <span class="text-lg font-bold text-slate-500"> / 10 題</span>
                </div>
                <div class="h-12 w-0.5 bg-amber-200 hidden md:block"></div>
                <div>
                    <span class="text-xs font-bold text-amber-700 uppercase tracking-wider block">等級稱號 Level</span>
                    <span id="levelBadge" class="inline-block mt-1 bg-amber-500 text-white text-sm font-black px-4 py-1.5 rounded-full shadow-sm">
                        英語小童星 🌟
                    </span>
                </div>
            </div>

            <!-- Sync Status Notice -->
            <div id="syncStatusBox" class="mb-6 p-4 rounded-xl text-left flex items-center justify-between text-sm bg-slate-100 border border-slate-200">
                <div class="flex items-center gap-3">
                    <i id="syncIcon" class="fa-solid fa-spinner fa-spin text-sky-500 text-xl"></i>
                    <div>
                        <div id="syncTitle" class="font-black text-slate-800">正在同步成績至 Google 試算表...</div>
                        <div id="syncDetail" class="text-xs text-slate-500">請保持網路連線</div>
                    </div>
                </div>
                <button id="retrySyncBtn" onclick="uploadResultToGoogle()" class="hidden px-3 py-1 bg-sky-500 text-white font-bold text-xs rounded-lg hover:bg-sky-600 transition">
                    重新傳送
                </button>
            </div>

            <!-- Details Review Toggle -->
            <div class="text-left mb-6">
                <h4 class="font-black text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-sky-500"></i> 答題詳細檢視 (Review):
                </h4>
                <div id="answersReview" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                    <!-- Dynamic Answer Details -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3 pt-4 border-t border-slate-200">
                <button onclick="restartQuiz()" class="px-5 py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-black rounded-xl text-sm transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 重新進行測驗
                </button>
                <button onclick="downloadCSV()" class="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-sm shadow-md transition">
                    <i class="fa-solid fa-file-excel mr-1"></i> 下載 Excel/CSV 成績
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 text-sm font-bold flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-info text-sky-400"></i>
        <span id="toastMsg">通知訊息</span>
    </div>

    <!-- Footer -->
    <footer class="mt-auto py-4 text-center text-xs text-slate-400 font-bold">
        國小三年級 英語課程程度評量的微型應用網站 &copy; 2026
    </footer>

    <script>
        // Question Bank for Taiwan Grade 3 Primary School English Level
        const questions = [
            {
                id: 1,
                category: "字母認知",
                question: "請問大寫字母 「G」 對應的小寫字母是什麼？",
                audioText: "G",
                hasAudio: true,
                options: ["g", "q", "j", "p"],
                answer: 0,
                hint: "仔細看看哪一個才是字母 G 的小寫喔！"
            },
            {
                id: 2,
                category: "聽力與單字",
                question: "請點擊聽力按鈕，選出你聽到的水果單字圖片與名稱：",
                audioText: "Apple",
                hasAudio: true,
                options: ["🍎 Apple", "🍌 Banana", "🍊 Orange", "🍇 Grape"],
                answer: 0,
                hint: "重複點擊黃色發音按鈕聽清楚發音喔！"
            },
            {
                id: 3,
                category: "生活對話",
                question: "當別人問你 「How are you?」 時，最適合的回答是什麼？",
                audioText: "How are you?",
                hasAudio: true,
                options: [
                    "I am fine, thank you.",
                    "Good morning!",
                    "My name is Tom.",
                    "I am eight years old."
                ],
                answer: 0,
                hint: "對方在問候「你最近好嗎？」"
            },
            {
                id: 4,
                category: "基礎數字",
                question: "看圖數一數：畫面上有幾顆星星？ ⭐⭐⭐⭐⭐",
                audioText: "Five stars",
                hasAudio: false,
                options: ["three", "four", "five", "six"],
                answer: 2,
                hint: "1, 2, 3, 4, 5 用英文怎麼說？"
            },
            {
                id: 5,
                category: "顏色認識",
                question: "香蕉成熟時通常是什麼顏色 「Yellow」？",
                audioText: "Yellow",
                hasAudio: true,
                options: ["紅色 Red", "黃色 Yellow", "藍色 Blue", "綠色 Green"],
                answer: 1,
                hint: "Yellow 是什麼顏色呢？"
            },
            {
                id: 6,
                category: "聽力與動物",
                question: "請點擊聽力按鈕，選出聽到的動物：",
                audioText: "Dog",
                hasAudio: true,
                options: ["🐱 Cat", "🐶 Dog", "🐦 Bird", "🐘 Elephant"],
                answer: 1,
                hint: "汪汪叫的動物用英文怎麼唸？"
            },
            {
                id: 7,
                category: "家人稱謂",
                question: "介紹媽媽時，句子 「This is my ______ .」 空格處應填入哪一個字？",
                audioText: "This is my mom.",
                hasAudio: true,
                options: ["dad", "brother", "mom", "sister"],
                answer: 2,
                hint: "Mom 代表哪一位家人？"
            },
            {
                id: 8,
                category: "文法與喜好",
                question: "「我喜歡紅色的蘋果。」英文寫法：I ______ red apples.",
                audioText: "I like red apples.",
                hasAudio: true,
                options: ["am", "like", "is", "can"],
                answer: 1,
                hint: "「喜歡」的英文是哪個字？"
            },
            {
                id: 9,
                category: "聽力指令",
                question: "點擊聽力按鈕，老師說的課堂指令 「Open your book.」 是什麼意思？",
                audioText: "Open your book.",
                hasAudio: true,
                options: [
                    "把你的書打開",
                    "把你的書合起來",
                    "請坐下",
                    "請站起來"
                ],
                answer: 0,
                hint: "Open 有打開的意思。"
            },
            {
                id: 10,
                category: "字母順序",
                question: "字母順序填空：A, B, C, ____ , E",
                audioText: "A, B, C, D, E",
                hasAudio: false,
                options: ["F", "D", "G", "H"],
                answer: 1,
                hint: "ABC 歌接下來接哪一個字母呢？"
            }
        ];

        let currentQuestionIndex = 0;
        let studentProfile = {
            studentClass: '',
            seatNumber: '',
            studentName: ''
        };
        let userAnswers = new Array(questions.length).fill(null);
        
        // 【後台串接】請在此處直接填入您的 Google Apps Script Web App URL
        const GOOGLE_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwv02yBJ8mZWu2AZI3VrefrOCNwrGF91QHhlQV-aaXD3P9YyAPGcrYL7Bpe6-Lwo2fKLw/exec';
        
        let localHistory = JSON.parse(localStorage.getItem('g3_english_history') || '[]');

        // Web Audio API for Gamified Sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Audio fallback
            }
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.15); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.25), 100); // E5
        }

        function playWrongSound() {
            playTone(220, 'triangle', 0.2); // A3
            setTimeout(() => playTone(196, 'triangle', 0.3), 150); // G3
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slightly slower for primary school kids
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast("您的瀏覽器不支援發音功能", "error");
            }
        }

        function startQuiz(event) {
            event.preventDefault();
            studentProfile.studentClass = document.getElementById('studentClass').value.trim();
            studentProfile.seatNumber = document.getElementById('seatNumber').value.trim();
            studentProfile.studentName = document.getElementById('studentName').value.trim();

            if (!studentProfile.studentClass || !studentProfile.seatNumber || !studentProfile.studentName) {
                showToast("請完整填寫班級、座號與姓名！", "warning");
                return;
            }

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            document.getElementById('displayStudentInfo').innerText = `${studentProfile.studentClass} (${studentProfile.seatNumber}號) ${studentProfile.studentName}`;
            
            currentQuestionIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            
            // Update badges & progress
            document.getElementById('questionBadge').innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('categoryBadge').innerText = q.category;
            const progressPercent = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            // Question Text & Audio
            document.getElementById('questionText').innerText = q.question;
            document.getElementById('questionHint').innerText = q.hint ? `💡 提示：${q.hint}` : '';

            const audioBtn = document.getElementById('audioBtn');
            if (q.hasAudio) {
                audioBtn.classList.remove('hidden');
                // Automatically play audio when question opens
                setTimeout(() => playCurrentQuestionAudio(), 300);
            } else {
                audioBtn.classList.add('hidden');
            }

            // Options rendering
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((optText, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left p-4 rounded-2xl border-2 font-bold transition flex items-center justify-between bounce-hover btn-press ${
                    isSelected 
                    ? 'border-sky-500 bg-sky-50 text-sky-900 shadow-md ring-2 ring-sky-200' 
                    : 'border-slate-200 bg-white hover:border-sky-300 hover:bg-sky-50/30 text-slate-700'
                }`;

                btn.onclick = () => selectOption(index);

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl ${isSelected ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-sm font-black">
                            ${String.fromCharCode(65 + index)}
                        </span>
                        <span class="text-base md:text-lg">${optText}</span>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-circle-check text-sky-500 text-xl"></i>' : ''}
                `;
                container.appendChild(btn);
            });

            // Update Next / Prev buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = userAnswers[currentQuestionIndex] === null;

            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerHTML = `完成測驗 Submit <i class="fa-solid fa-paper-plane ml-1"></i>`;
                nextBtn.className = "px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-black text-sm shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed";
            } else {
                nextBtn.innerHTML = `下一題 <i class="fa-solid fa-arrow-right ml-1"></i>`;
                nextBtn.className = "px-6 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-black text-sm shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed";
            }
        }

        function playCurrentQuestionAudio() {
            const q = questions[currentQuestionIndex];
            if (q && q.audioText) {
                speakText(q.audioText);
            }
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            playTone(400 + index * 50, 'sine', 0.1);
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;

            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / questions.length) * 100);

            // Audio celebration
            if (score >= 80) playCorrectSound();

            document.getElementById('resultStudentTitle').innerText = `${studentProfile.studentClass} ${studentProfile.studentName} 同學的表現報告`;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('correctCount').innerText = correctCount;

            // Level Badge Determination
            const levelBadge = document.getElementById('levelBadge');
            if (score === 100) {
                levelBadge.innerText = '🏆 英語小高手 (Master)';
                levelBadge.className = 'inline-block mt-1 bg-amber-500 text-white text-sm font-black px-4 py-1.5 rounded-full shadow-md';
            } else if (score >= 70) {
                levelBadge.innerText = '🌟 英語探險家 (Explorer)';
                levelBadge.className = 'inline-block mt-1 bg-sky-500 text-white text-sm font-black px-4 py-1.5 rounded-full shadow-md';
            } else {
                levelBadge.innerText = '🌱 英語新星 (Beginner)';
                levelBadge.className = 'inline-block mt-1 bg-emerald-500 text-white text-sm font-black px-4 py-1.5 rounded-full shadow-md';
            }

            // Render Answer Review List
            const reviewContainer = document.getElementById('answersReview');
            reviewContainer.innerHTML = '';

            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.answer;
                
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border flex items-start gap-3 text-sm ${
                    isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-red-50/60 border-red-200'
                }`;

                card.innerHTML = `
                    <div class="mt-0.5 text-lg">
                        ${isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500"></i>'}
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-slate-800">
                            Q${idx+1}. ${q.question}
                        </div>
                        <div class="mt-1 text-xs space-y-0.5">
                            <div class="${isCorrect ? 'text-emerald-700' : 'text-red-600'} font-bold">
                                您的回答：${userAns !== null ? q.options[userAns] : '未作答'}
                            </div>
                            ${!isCorrect ? `<div class="text-emerald-700 font-bold">正確答案：${q.options[q.answer]}</div>` : ''}
                        </div>
                    </div>
                `;
                reviewContainer.appendChild(card);
            });

            // Automatically Upload Result
            uploadResultToGoogle();
        }

        async function uploadResultToGoogle() {
            const syncIcon = document.getElementById('syncIcon');
            const syncTitle = document.getElementById('syncTitle');
            const syncDetail = document.getElementById('syncDetail');
            const retryBtn = document.getElementById('retrySyncBtn');
            const syncBox = document.getElementById('syncStatusBox');

            // Calculate metrics
            let correctCount = 0;
            const detailsArr = [];
            questions.forEach((q, idx) => {
                const isCorrect = userAnswers[idx] === q.answer;
                if (isCorrect) correctCount++;
                detailsArr.push(`Q${idx+1}:${isCorrect ? '✓' : '✗'}`);
            });
            const score = Math.round((correctCount / questions.length) * 100);

            const payload = {
                timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
                studentClass: studentProfile.studentClass,
                seatNumber: studentProfile.seatNumber,
                studentName: studentProfile.studentName,
                score: score,
                correctCount: correctCount,
                accuracy: score,
                detailText: detailsArr.join(' | ')
            };

            // Store in Local History
            localHistory.unshift(payload);
            localStorage.setItem('g3_english_history', JSON.stringify(localHistory.slice(0, 50)));

            // If Webhook URL is missing
            if (!GOOGLE_WEBHOOK_URL) {
                syncIcon.className = "fa-solid fa-circle-check text-emerald-500 text-xl";
                syncTitle.innerText = "測驗完成！成績已儲存";
                syncDetail.innerText = "成績已成功儲存至本機記錄。";
                syncBox.className = "mb-6 p-4 rounded-xl text-left flex items-center justify-between text-sm bg-emerald-50 border border-emerald-200";
                retryBtn.classList.add('hidden');
                return;
            }

            // Syncing UI State
            syncIcon.className = "fa-solid fa-spinner fa-spin text-sky-500 text-xl";
            syncTitle.innerText = "正在同步成績至 Google 試算表...";
            syncDetail.innerText = "正在將資料寫入雲端表格中...";
            syncBox.className = "mb-6 p-4 rounded-xl text-left flex items-center justify-between text-sm bg-sky-50 border border-sky-200";
            retryBtn.classList.add('hidden');

            try {
                // Using mode: 'no-cors' to handle Google Apps Script redirect responses safely
                await fetch(GOOGLE_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                // Standard Webhook success simulation in no-cors
                syncIcon.className = "fa-solid fa-circle-check text-emerald-500 text-xl";
                syncTitle.innerText = "已成功匯入 Google 試算表！";
                syncDetail.innerText = `資料已寫入雲端（${payload.timestamp}）`;
                syncBox.className = "mb-6 p-4 rounded-xl text-left flex items-center justify-between text-sm bg-emerald-50 border border-emerald-200";
                showToast("成績已順利傳送至 Google 試算表！", "success");

            } catch (error) {
                console.error("Upload error:", error);
                syncIcon.className = "fa-solid fa-triangle-exclamation text-red-500 text-xl";
                syncTitle.innerText = "傳送至 Google 試算表失敗";
                syncDetail.innerText = "請檢查網路連線或後台網址設定。";
                syncBox.className = "mb-6 p-4 rounded-xl text-left flex items-center justify-between text-sm bg-red-50 border border-red-200";
                retryBtn.classList.remove('hidden');
            }
        }

        function downloadCSV() {
            if (localHistory.length === 0) {
                showToast("目前尚無成績紀錄可供匯出", "warning");
                return;
            }

            let csvContent = "\uFEFF"; // UTF-BOM for Chinese characters in Excel
            csvContent += "測驗時間,班級,座號,姓名,總得分,答對題數,答題率,答題明細\n";

            localHistory.forEach(row => {
                csvContent += `"${row.timestamp}","${row.studentClass}","${row.seatNumber}","${row.studentName}","${row.score}","${row.correctCount}","${row.accuracy}%","${row.detailText}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `國小三年級英語測驗成績單_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("已成功下載成績 CSV 檔案！", "success");
        }

        function restartQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
        }

        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-lg";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
